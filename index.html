<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Vibes Team | Registro Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030603;
      --card-bg: rgba(10, 15, 10, 0.75);
      --neon-green: #00ff66;
      --neon-glow: rgba(0, 255, 102, 0.4);
      --text-white: #ffffff;
      --text-dim: #7d947d;
      --border-color: rgba(0, 255, 102, 0.2);
      --input-bg: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Logo gigante con transparencia en el fondo */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 600px;
      height: 90vw;
      max-height: 600px;
      background-image: url('img/logo-general.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.06;
      filter: drop-shadow(0 0 25px var(--neon-green));
      z-index: 0;
      pointer-events: none;
    }

    /* Luces ambiente */
    .bg-glow-top {
      position: absolute;
      width: 350px;
      height: 350px;
      background: var(--neon-green);
      filter: blur(180px);
      opacity: 0.15;
      border-radius: 50%;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      width: 100%;
      max-width: 440px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Encabezado */
    .brand-header {
      text-align: center;
    }

    .logo-box {
      width: 100px;
      height: 100px;
      margin: 0 auto 12px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--neon-green), rgba(0, 255, 102, 0.1));
      box-shadow: 0 0 25px var(--neon-glow);
    }

    .brand-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .glow-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 15px var(--neon-glow);
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: var(--neon-green);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Tarjeta del Formulario */
    .card-form {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    .card-form::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
    }

    .card-form h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      color: var(--text-white);
      text-align: center;
      margin-bottom: 6px;
    }

    .form-desc {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 24px;
    }

    /* Inputs */
    .input-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #c0d1c0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--neon-green);
      background: rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 15px var(--neon-glow);
    }

    /* Botón Neón */
    .btn-neon {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      background: var(--neon-green);
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px var(--neon-glow);
    }

    .btn-neon:hover {
      background: #33ff85;
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--neon-green);
    }

    .btn-neon:active {
      transform: translateY(0);
    }

    /* Enlace Footer */
    .footer-access {
      text-align: center;
    }

    .staff-link {
      color: var(--text-dim);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.3s;
    }

    .staff-link:hover {
      color: var(--neon-green);
    }
  </style>
</head>
<body>

  <div class="bg-glow-top"></div>

  <main class="main-container">
    <header class="brand-header">
      <div class="logo-box">
        <img src="img/logo-general.jpg" alt="After Vibes Logo" class="brand-logo">
      </div>
      <h1 class="glow-text">AFTER VIBES</h1>
      <p class="subtitle">PARTY ORGANIZATION</p>
    </header>

    <section class="card-form">
      <h2>FORMULARIO DE INGRESO</h2>
      <p class="form-desc">Completa tus datos para postular al equipo.</p>

      <form id="joinForm">
        <div class="input-group">
          <label for="fullname">Nombre y Apellido / Apodo</label>
          <input type="text" id="fullname" placeholder="Ej: Carlos / @Charls" required autocomplete="off">
        </div>

        <div class="input-group">
          <label for="age">Edad</label>
          <input type="number" id="age" placeholder="Tu edad" min="12" max="99" required>
        </div>

        <div class="input-group">
          <label for="tiktok">Usuario de TikTok</label>
          <input type="text" id="tiktok" placeholder="@tu_usuario" required autocomplete="off">
        </div>

        <div class="input-group">
          <label for="phone">Número de WhatsApp</label>
          <input type="tel" id="phone" placeholder="+58 412 0000000" required autocomplete="off">
        </div>

        <button type="submit" class="btn-neon">ENVIAR SOLICITUD</button>
      </form>
    </section>

    <footer class="footer-access">
      <a href="login.html" class="staff-link">🔐 Acceso Privado Staff / Admin</a>
    </footer>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
