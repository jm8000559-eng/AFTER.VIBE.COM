<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Vibes | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030603;
      --card-bg: rgba(10, 15, 10, 0.85);
      --neon-green: #00ff66;
      --neon-glow: rgba(0, 255, 102, 0.3);
      --text-white: #ffffff;
      --text-dim: #7d947d;
      --border-color: rgba(0, 255, 102, 0.2);
      --red-alert: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 30px 15px;
      position: relative;
    }

    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--neon-green);
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--red-alert);
      color: var(--red-alert);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: var(--red-alert);
      color: #fff;
    }

    .card-table {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      overflow-x: auto;
      backdrop-filter: blur(10px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--neon-green);
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 12px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tiktok-link {
      color: var(--neon-green);
      text-decoration: none;
      font-weight: 600;
    }

    .status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status.pending { background: rgba(255, 204, 0, 0.2); color: #ffcc00; }
    .status.approved { background: rgba(0, 255, 102, 0.2); color: var(--neon-green); }
    .status.rejected { background: rgba(255, 51, 102, 0.2); color: var(--red-alert); }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .btn-approve { background: var(--neon-green); color: #000; }
    .btn-reject { background: var(--red-alert); color: #fff; }
  </style>
</head>
<body>

  <div class="admin-container">
    <header>
      <div class="brand-title">AFTER VIBES // PANEL ADMIN</div>
      <button class="btn-logout" onclick="sessionStorage.removeItem('admin_authenticated'); location.reload();">Cerrar Sesión</button>
    </header>

    <section class="card-table">
      <table>
        <thead>
          <tr>
            <th>Postulante</th>
            <th>Edad</th>
            <th>TikTok</th>
            <th>WhatsApp</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="applicantsList">
          <tr>
            <td colspan="6" style="text-align:center; color: var(--text-dim);">Cargando solicitudes desde la base de datos...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>

  <!-- LIBRERÍA DE SUPABASE Y SCRIPT DEL PANEL -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/panel.js"></script>
</body>
</html>
