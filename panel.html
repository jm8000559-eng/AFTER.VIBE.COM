<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Vibes Team | Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030603;
      --card-bg: rgba(10, 15, 10, 0.85);
      --neon-green: #00ff66;
      --neon-glow: rgba(0, 255, 102, 0.35);
      --red-alert: #ff3366;
      --text-white: #ffffff;
      --text-dim: #7d947d;
      --border-color: rgba(0, 255, 102, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 20px 12px;
      position: relative;
      overflow-x: hidden;
    }

    /* Logo gigante con transparencia en el fondo del Panel */
    body::before {
      content: '';
      position: fixed;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85vw;
      max-width: 650px;
      height: 85vw;
      max-height: 650px;
      background-image: url('img/logo-general.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.05;
      filter: drop-shadow(0 0 35px var(--neon-green));
      z-index: 0;
      pointer-events: none;
    }

    /* Header Nav */
    .admin-nav {
      max-width: 1000px;
      margin: 0 auto 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px 22px;
      border-radius: 18px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--neon-green);
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-glow);
    }

    .btn-logout {
      background: rgba(255, 51, 102, 0.12);
      border: 1px solid var(--red-alert);
      color: var(--red-alert);
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
    }

    .btn-logout:hover {
      background: var(--red-alert);
      color: #000;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
    }

    /* Layout Principal */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .panel-header {
      margin-bottom: 22px;
    }

    .panel-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* Tarjeta de Solicitudes */
    .card-table {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      overflow-x: auto;
    }

    /* Tabla adaptable */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 620px;
    }

    th {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-green);
      text-transform: uppercase;
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      letter-spacing: 1px;
    }

    td {
      padding: 16px 14px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tiktok-link {
      color: var(--neon-green);
      text-decoration: none;
      font-weight: 600;
      transition: text-shadow 0.3s;
    }

    .tiktok-link:hover {
      text-shadow: 0 0 8px var(--neon-glow);
      text-decoration: underline;
    }

    /* Insignias de Estado */
    .status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .status.pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid #ffc107; }
    .status.approved { background: rgba(0, 255, 102, 0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .status.rejected { background: rgba(255, 51, 102, 0.15); color: var(--red-alert); border: 1px solid var(--red-alert); }

    /* Botones de Acción */
    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      font-size: 0.75rem;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-approve { background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-glow); }
    .btn-reject { background: var(--red-alert); color: #fff; }
    
    .btn-action:hover { transform: translateY(-2px); }
    .btn-approve:hover { box-shadow: 0 0 18px var(--neon-green); }

    /* Responsive */
    @media (max-width: 768px) {
      .admin-nav { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav class="admin-nav">
    <div class="brand-title">AFTER VIBES // ADMIN</div>
    <a href="login.html" class="btn-logout">Cerrar Sesión</a>
  </nav>

  <main class="container">
    <div class="panel-header">
      <h1>SOLICITUDES DE INGRESO</h1>
      <p style="color: var(--text-dim); font-size: 0.85rem;">Revisa las fichas de los postulantes, verifica su TikTok y gestiona accesos.</p>
    </div>

    <section class="card-table">
      <table>
        <thead>
          <tr>
            <th>Postulante</th>
            <th>Edad</th>
            <th>TikTok</th>
            <th>WhatsApp</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="applicantsList">
          <!-- Ejemplo visual de cómo cargan las filas -->
          <tr>
            <td><strong>Carlos / @Charls</strong></td>
            <td>18</td>
            <td><a href="https://tiktok.com/@carlos_vibes" target="_blank" class="tiktok-link">@carlos_vibes</a></td>
            <td>+58 412 1234567</td>
            <td><span class="status pending">Pendiente</span></td>
            <td>
              <div class="actions">
                <button class="btn-action btn-approve">Aprobar</button>
                <button class="btn-action btn-reject">Rechazar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/panel.js"></script>
</body>
</html>
