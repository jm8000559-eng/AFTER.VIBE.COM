<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Vibes Team | Login Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030603;
      --card-bg: rgba(10, 15, 10, 0.8);
      --neon-green: #00ff66;
      --neon-glow: rgba(0, 255, 102, 0.4);
      --text-white: #ffffff;
      --text-dim: #7d947d;
      --border-color: rgba(0, 255, 102, 0.25);
      --input-bg: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Logo transparente de fondo para Login */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 550px;
      height: 90vw;
      max-height: 550px;
      background-image: url('img/logo-general.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.06;
      filter: drop-shadow(0 0 20px var(--neon-green));
      z-index: 0;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      z-index: 1;
    }

    .card-login {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 25px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--neon-green);
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-glow);
    }

    .brand-header p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #c0d1c0;
      text-transform: uppercase;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-glow);
    }

    .btn-neon {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      background: var(--neon-green);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 1px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px var(--neon-glow);
    }

    .btn-neon:hover {
      background: #33ff85;
      box-shadow: 0 0 30px var(--neon-green);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--neon-green);
    }
  </style>
</head>
<body>

  <main class="login-container">
    <section class="card-login">
      <header class="brand-header">
        <h1>AFTER VIBES</h1>
        <p>ACCESO ADMINISTRADOR</p>
      </header>

      <form id="loginForm" action="panel.html">
        <div class="input-group">
          <label for="user">Usuario</label>
          <input type="text" id="user" placeholder="Ingresa tu usuario" required autocomplete="off">
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-neon">INGRESAR AL PANEL</button>
      </form>

      <a href="index.html" class="back-link">← Volver al registro público</a>
    </section>
  </main>

</body>
</html>
